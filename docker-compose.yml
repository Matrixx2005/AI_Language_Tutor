# Hạ tầng dev: PostgreSQL (Tuần 2) + Qdrant (Tuần 4, vector cho RAG).
# Giá trị lấy từ .env ở thư mục gốc (Compose tự đọc). Chạy: docker compose up -d
services:
  postgres:
    # Ghim major 18; bản vá (18.x) tự cập nhật khi pull. Đổi major cần kế hoạch nâng cấp dữ liệu.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Đặt POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Đặt POSTGRES_DB trong .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ai_language_tutor_test}
    ports:
      # Chỉ mở trên máy local, không lộ ra mạng LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 lưu dữ liệu dưới /var/lib/postgresql/<major>/ — mount thư mục cha.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Ghim đúng bản vá (v1.20.2, phát hành 2026-11-16); client Python qdrant-client==1.20.0 cùng nhánh 1.20.
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      # Chỉ mở trên máy local (REST 6333). Không mở gRPC 6334 vì app dùng REST.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Image không có curl/wget: gọi /readyz bằng bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
