# Hạ tầng dev. Tuần 2: chỉ PostgreSQL (Qdrant thêm ở Tuần 4).
# Giá trị lấy từ .env ở thư mục gốc (Compose tự đọc). Chạy: docker compose up -d
services:
  postgres:
    # Ghim major 18; bản vá (18.x) tự cập nhật khi pull. Đổi major cần kế hoạch nâng cấp dữ liệu.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Đặt POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Đặt POSTGRES_DB trong .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ai_language_tutor_test}
    ports:
      # Chỉ mở trên máy local, không lộ ra mạng LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 lưu dữ liệu dưới /var/lib/postgresql/<major>/ — mount thư mục cha.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
