language_code: en
display_name: English
display_name_vi: Tiếng Anh

levels:
  - code: A1
    display_name: Beginner
    display_name_vi: Sơ cấp
  - code: A2
    display_name: Elementary
    display_name_vi: Sơ trung cấp
  - code: B1
    display_name: Intermediate
    display_name_vi: Trung cấp

placement:
  # Bộ câu hỏi trong bảng `questions` (nạp bằng scripts/load_placement.py từ data/evaluation/placement_v1.json).
  question_set: placement_v1
  score_scale: percent
  assignment_rule: highest_level_threshold_not_exceeded
  thresholds:
    A1: 0
    A2: 40
    B1: 70
  status: provisional
  note: >
    Ngưỡng là cấu hình khởi đầu cần được duyệt và kiểm tra trên pilot;
    không phải kết quả nghiên cứu hay chuẩn CEFR đã được xác nhận.

retrieval:
  # Tuần 4 (RAG). Đường dẫn tính từ thư mục gốc dự án.
  corpus_file: data/processed/grammar_lessons_v1.json
  keywords_file: data/processed/keywords_vi_v1.json   # từ khóa tiếng Việt (mở rộng phía tài liệu), tùy chọn
  tokenizer:
    # Áp dụng GIỐNG HỆT cho tài liệu và truy vấn (BM25). Truy vấn có thể là tiếng Việt hoặc tiếng Anh.
    unicode_form: NFKC
    lowercase: true
    strip_diacritics: true    # "động từ" → "dong tu": người học hay gõ thiếu dấu
    min_token_length: 1
    # Từ chức năng rất phổ biến (Anh + Việt không dấu) — IDF thấp, bỏ để giảm nhiễu.
    stopwords: [the, a, an, and, or, to, of, in, on, at, is, are, be, it, this, that, for, with, i, you,
                la, va, cua, co, khong, thi, nhu, the, nao, gi, cho, voi, mot, nhung, cac, khi, de, duoc]
